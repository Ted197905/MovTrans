# /etc/nginx/sites-available/movtrans
server {
    listen 80;
    server_name mt.blackout.kr;
    root /var/www/movtrans/public;
    index index.php;

    # uploads arrive in 8 MB chunks; this only needs to cover one chunk
    client_max_body_size 32M;

    location / { try_files $uri $uri/ /index.php$is_args$args; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # PHP authorizes, nginx streams (X-Accel-Redirect). Range requests for <video> seeking work here.
    location /internal-media/ {
        internal;
        alias /var/www/movtrans/writable/media/;
    }

    location ~ /\.(?!well-known) { deny all; }
}
